schema_version = 1

[resources]
mode = "shared"
cpu_threads = 8
memory = 17179869184
timeout = 3600
gpu_count = 1
gpu_exclusive = true

[paths]
artifact_root = "outputs"
cleanup_roots = ["outputs", ".igor/staging"]

[report]
enabled = true
trigger = "family-completed"
output = "RESULTS.md"
mode = "replace-generated-file"
generator = "deterministic"
prompt_file = ".igor/report-prompt.md"

[attempt_retry]
max_attempts = 2
initial_delay_seconds = 1
max_delay_seconds = 30
multiplier = 2

[action_retry]
max_attempts = 3
initial_delay_seconds = 5
max_delay_seconds = 300
multiplier = 2

[delivery_retry]
max_attempts = 8
initial_delay_seconds = 10
max_delay_seconds = 3600
multiplier = 2
