# Host-specific Igor configuration. Credentials belong here, never in a project.
schema_version = 1

[paths]
# Relative paths are resolved from this file's directory.
# state_dir = "../state"
# runtime_dir = "/run/user/1000/igor"
# database = "../state/igor.sqlite3"
# log_dir = "../state/logs"
# worktree_dir = "../state/worktrees"
# report_dir = "../state/reports"

[host]
# Optional scheduling capacities. They control admission but are not cgroup
# limits: a process can exceed its declared CPU or memory request.
# cpu_threads = 16
# memory_bytes = 68719476736
# max_concurrent_jobs = 1
# discover_gpus = true
# A non-empty list overrides automatic GPU discovery.
# gpus = ["GPU-uuid"]
# named_resources = ["scratch-disk"]

[telegram]
